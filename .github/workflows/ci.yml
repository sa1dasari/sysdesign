name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (tests only; the skill itself has no dependencies)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null && npm install playwright
          npx playwright install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Test
        run: node --test
      - name: Examples build cleanly
        run: |
          for s in examples/*/spec.mjs; do
            node scripts/build.mjs "$s" --out "$RUNNER_TEMP/$(basename "$(dirname "$s")").html"
          done
