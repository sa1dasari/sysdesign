<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Netflix recommendations</title>
<style>:root{
  --bg:#f6f4ef; --panel:#fffdf8; --ink:#1c1b19; --mute:#6b675e; --line:#d9d4c7; --faint:#ece8dd;
  --accent:#c2410c; --cool:#2f7d5b; --warm:#c98a0b; --hot:#c0392b;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:ui-serif,Georgia,"Times New Roman",serif;
  /* chart series, fixed order (validated for colour-vision deficiency on --panel) */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
}
:root[data-theme=dark]{
  --bg:#141412; --panel:#1b1b18; --ink:#ece9e0; --mute:#9a958a; --line:#34322c; --faint:#24231f;
  --accent:#fb923c; --cool:#4ca97e; --warm:#e0a526; --hot:#e5584a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:48px;max-width:1180px;margin:0 auto;padding:0 28px}
nav.toc{position:sticky;top:0;align-self:start;height:100vh;padding:40px 0;overflow:auto;font-size:13px}
nav.toc .brand{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:18px}
nav.toc a{display:block;padding:5px 0 5px 12px;color:var(--mute);text-decoration:none;border-left:2px solid var(--line)}
nav.toc a:hover{color:var(--ink)}
nav.toc a.on{color:var(--ink);border-left-color:var(--accent)}
nav.toc button{margin-top:18px;font:12px var(--mono);background:none;border:1px solid var(--line);color:var(--mute);padding:4px 10px;border-radius:6px;cursor:pointer}
main{padding:56px 0 120px;min-width:0}
header.hero{margin-bottom:56px}
.kind{display:inline-block;font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);padding:2px 8px;border-radius:99px}
h1{font:600 clamp(32px,5vw,48px)/1.1 var(--serif);letter-spacing:-.02em;margin:16px 0 10px}
.sub{font-size:19px;color:var(--mute);max-width:60ch;margin:0}
.idea{margin:28px 0 0;padding:18px 22px;border-left:3px solid var(--accent);background:var(--panel);font:italic 20px/1.45 var(--serif);max-width:62ch}
.idea small{display:block;font:600 11px var(--mono);font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
section{margin:0 0 72px;scroll-margin-top:24px}
section>h2{font:600 26px/1.2 var(--serif);margin:0 0 6px;letter-spacing:-.01em}
section>h2 .n{font:500 12px var(--mono);color:var(--accent);margin-right:10px;vertical-align:middle}
section>.lede{color:var(--mute);margin:0 0 22px;max-width:64ch}
p{margin:0 0 14px;max-width:68ch}
code{font:.88em var(--mono);background:var(--faint);padding:1px 5px;border-radius:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card h3{font:600 12px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
.card ul{margin:0;padding-left:18px}
.card li{margin:4px 0}
.tag{font:11px var(--mono);color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-right:6px}
/* estimation */
.est{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px}
@media(max-width:820px){.est{grid-template-columns:1fr}}
.inp{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-bottom:14px;align-items:baseline}
.inp label{font-size:14px}
.inp output{font:13px var(--mono);color:var(--accent)}
.inp input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.rows{width:100%;border-collapse:collapse;font-size:14px}
.rows td{padding:7px 0;border-bottom:1px solid var(--faint)}
.rows td:last-child{text-align:right;font:14px var(--mono);white-space:nowrap}
.rows .why{display:block;font-size:12px;color:var(--mute)}
/* api + data */
.ep{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.ep .m{font:600 12px var(--mono);padding:2px 8px;border-radius:5px;background:var(--faint)}
.ep .m.POST,.ep .m.PUT,.ep .m.DELETE,.ep .m.PATCH{color:var(--accent)}
.ep .p{font:14px var(--mono)}
.ep .d{grid-column:2;color:var(--mute);font-size:14px}
.ep pre{grid-column:2;margin:4px 0 0}
pre{background:var(--faint);padding:10px 12px;border-radius:8px;overflow:auto;font:12.5px/1.5 var(--mono);margin:0}
table.cols{width:100%;border-collapse:collapse;font:13px var(--mono)}
table.cols td{padding:3px 8px 3px 0;vertical-align:top}
table.cols td.t{color:var(--mute)}
table.cols td.k{color:var(--accent);width:2.5em}
table.cols td.nt{color:var(--mute);font-family:var(--sans);font-size:12px}
.store{font:11px var(--mono);color:var(--mute);float:right}
/* sim */
.sim{padding:0;overflow:hidden}
.sim .bar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.chip{font:12px var(--mono);background:var(--faint);border:1px solid var(--line);color:var(--ink);padding:5px 10px;border-radius:99px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage{overflow-x:auto;padding:6px 8px}
.stage svg{display:block;min-width:720px;width:100%;height:auto}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border-top:1px solid var(--line)}
.metric{padding:12px 14px;border-right:1px solid var(--line)}
.metric:last-child{border-right:0}
.metric b{display:block;font:600 20px var(--mono)}
.metric span{font:11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.metric.bad b{color:var(--hot)}
.metric.warn b{color:var(--warm)}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 22px;padding:14px;border-top:1px solid var(--line)}
.simnote{padding:12px 16px;border-top:1px solid var(--line);font-size:14px;color:var(--mute);min-height:3.4em}
.simnote b{color:var(--ink)}
.node rect.box{stroke:var(--ink);stroke-width:1.2;rx:8;fill:color-mix(in srgb,var(--hot) calc(var(--u)*100%),var(--panel))}
.node.sel rect.box{stroke:var(--accent);stroke-width:2.4}
.node.dead rect.box{stroke:var(--hot);stroke-dasharray:4 3}
.node text{fill:var(--ink);font:600 14px var(--sans);pointer-events:none}
.node text.nl.two{font-size:13px}
symbol .p,symbol .m,symbol .n,symbol .a,symbol .g,symbol .k{stroke:var(--ink);stroke-linejoin:round;stroke-linecap:round}
symbol .p{fill:var(--panel)}symbol .m{fill:var(--line)}symbol .n{fill:none}
symbol .a{fill:var(--warm)}symbol .g{fill:var(--cool)}symbol .k{fill:var(--ink)}
.node text.s{font:12px var(--mono);fill:var(--mute)}
.node:hover rect.box{stroke:var(--accent)}
.node{cursor:pointer}
.ubar{fill:var(--cool)}
.ubar.warn{fill:var(--warm)}.ubar.hot{fill:var(--hot)}
.edge{fill:none;stroke:var(--line);stroke-linecap:round}
.edge.async{stroke-dasharray:5 4}
.elabel{font:11.5px var(--mono);fill:var(--mute);paint-order:stroke;stroke:var(--panel);stroke-width:4px}
/* lanes and walkthroughs */
.lane{fill:var(--faint);stroke:var(--line);stroke-dasharray:4 4}
.lanel{font:600 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;fill:var(--mute);paint-order:stroke;stroke:var(--faint);stroke-width:5px;stroke-linejoin:round}
.lanen{font:400 11px var(--sans);letter-spacing:0;text-transform:none}
.sim .bar.flows{background:var(--faint)}
.barl{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);align-self:center;margin-right:2px}
svg.walking .node:not(.hl),svg.walking .elabel{opacity:.3}
svg.walking .edge:not(.hl){opacity:.25}
svg.walking .dot{opacity:.25}
.edge.hl{stroke:var(--accent);stroke-width:3.5}
.node.hl rect.box{stroke:var(--accent);stroke-width:2.6}
.walk{border-top:1px solid var(--line);padding:12px 16px;background:var(--panel)}
.wctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.wcount{font:600 12px var(--mono);color:var(--accent);margin-right:6px}
.wtext{font-size:16px;max-width:70ch}
.chip:disabled{opacity:.4;cursor:default}
.dot{fill:var(--accent)}
.dot.async{fill:var(--mute)}
.detail{padding:14px 16px;border-top:1px solid var(--line);font-size:14px;display:grid;gap:4px 18px;grid-template-columns:auto 1fr}
.detail dt{font:11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding-top:2px}
.detail dd{margin:0}
/* tradeoffs, failures, qa */
.opt{display:flex;flex-direction:column;gap:6px}
.opt.pick{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.opt h4{margin:0;font:600 16px var(--serif)}
.opt .badge{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.pro::before{content:"+ ";color:var(--cool);font-family:var(--mono)}
.con::before{content:"– ";color:var(--hot);font-family:var(--mono)}
.q{margin:0 0 6px}
.q summary{cursor:pointer;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-weight:600}
.q[open] summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
.q .a{padding:12px 16px;border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;background:var(--panel)}
.fail h4{margin:0 0 6px;font:600 15px var(--sans)}
.fail dl{margin:0;font-size:14px}.fail dt{font:11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-top:8px}.fail dd{margin:0}
/* lld */
.diagram{padding:10px;overflow-x:auto}
.diagram svg{display:block;margin:0 auto;max-width:100%;height:auto}
.cls rect{fill:var(--panel);stroke:var(--ink);stroke-width:1.2}
.cls .hd{fill:var(--faint)}
.cls text{font:12px var(--mono);fill:var(--ink)}
.cls text.h{font:600 13px var(--sans)}
.cls text.st{font:italic 10.5px var(--mono);fill:var(--mute)}
.cls{cursor:pointer}
.cls.sel rect.fr{stroke:var(--accent);stroke-width:2.4}
.rel{stroke:var(--ink);fill:none;stroke-width:1.2}
.rel.dash{stroke-dasharray:5 4}
.rl{font:10.5px var(--mono);fill:var(--mute);paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.life{stroke:var(--line);stroke-dasharray:4 4}
.actor rect{fill:var(--panel);stroke:var(--ink);stroke-width:1.2;rx:6}
.actor text{font:600 12.5px var(--sans);fill:var(--ink)}
.msg{transition:opacity .2s}
.msg.off{opacity:.22}
.msg line,.msg path{stroke:var(--ink);fill:none;stroke-width:1.3}
.msg.ret line{stroke-dasharray:5 4}
.msg.on line,.msg.on path{stroke:var(--accent);stroke-width:2}
.msg text{font:12px var(--mono);fill:var(--ink)}
.msg.on text{fill:var(--accent)}
.st rect.sb{fill:var(--panel);stroke:var(--ink);stroke-width:1.2}
.stn text{font:600 13px var(--sans);fill:var(--ink)}
.stn.cur rect.sb{fill:var(--ink)}.stn.cur text{fill:var(--bg)}
.stn.term rect.sb{stroke-width:2.6}
.tr{stroke:var(--ink);fill:none;stroke-width:1.2}
.tr.live{stroke:var(--accent);stroke-width:2.2}
.tl{font:11px var(--mono);fill:var(--mute);paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.ctl .grow{flex:1;color:var(--mute);font-size:14px;min-width:200px}
.steps{display:grid;grid-template-columns:220px minmax(0,1fr);}
@media(max-width:820px){.steps{grid-template-columns:1fr}}
.steps ol{list-style:none;margin:0;padding:8px;border-right:1px solid var(--line);max-height:420px;overflow:auto}
.steps li button{width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 10px;font:12.5px var(--mono);color:var(--mute);cursor:pointer}
.steps li button.on{background:var(--ink);color:var(--bg)}
.steps .pane{padding:16px 18px}
.steps .call{font:14px var(--mono);margin:0 0 8px}
.kv{width:100%;border-collapse:collapse;font:13px var(--mono);margin-top:10px}
.kv td{padding:4px 8px;border-bottom:1px solid var(--faint);vertical-align:top}
.kv td:first-child{color:var(--mute);width:34%}
.kv tr.chg td:last-child{color:var(--accent);font-weight:600}
.tabs{display:flex;gap:4px;padding:8px 8px 0;border-bottom:1px solid var(--line)}
.tabs button{font:12px var(--mono);background:none;border:0;border-bottom:2px solid transparent;padding:6px 10px;color:var(--mute);cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
pre.code{border-radius:0 0 12px 12px;background:var(--panel);padding:14px 0;counter-reset:l;max-height:560px}
pre.code .ln{display:block;padding:0 16px 0 0;white-space:pre}
pre.code .ln::before{counter-increment:l;content:counter(l);display:inline-block;width:3em;padding-right:14px;text-align:right;color:var(--mute);opacity:.6}
.tk-k{color:var(--accent)}.tk-s{color:var(--cool)}.tk-c{color:var(--mute);font-style:italic}.tk-n{color:var(--warm)}
footer{color:var(--mute);font:12px var(--mono);border-top:1px solid var(--line);padding-top:18px}
@media(max-width:900px){.wrap{grid-template-columns:1fr;gap:0;padding:0 18px}nav.toc{display:none}}
/* chart */
.viz .ctrls.top{border-top:0;border-bottom:1px solid var(--line)}
.plot{position:relative;padding:8px 6px 0}
.plot svg{display:block;width:100%;height:auto;touch-action:pan-y}
.plot text{font:11px var(--mono);fill:var(--mute)}
.plot .an{font:12px var(--sans);fill:var(--mute)}
.plot .cg{stroke:var(--faint)}
.plot .ca{stroke:var(--line)}
.plot .cs{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.plot .cl{font:12px var(--sans);fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.plot .cm{stroke:var(--ink);stroke-dasharray:3 3;opacity:.45}
.plot .cmt{font:600 11px var(--mono);fill:var(--ink)}
.plot .cx{stroke:var(--mute);opacity:0;pointer-events:none}
.plot .cd{stroke:var(--panel);stroke-width:2;pointer-events:none}
.cs.s0{stroke:var(--s1)}.cs.s1{stroke:var(--s2)}.cs.s2{stroke:var(--s3)}.cs.s3{stroke:var(--s4)}
.cd.s0{fill:var(--s1)}.cd.s1{fill:var(--s2)}.cd.s2{fill:var(--s3)}.cd.s3{fill:var(--s4)}
.legend i,.tip i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:7px}
i.s0{background:var(--s1)}i.s1{background:var(--s2)}i.s2{background:var(--s3)}i.s3{background:var(--s4)}
.legend{display:flex;flex-wrap:wrap;gap:6px 22px;padding:10px 16px 12px;font-size:14px}
.legend b{font:600 14px var(--mono);margin-left:8px}
.tip{position:absolute;display:none;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.12);min-width:170px;z-index:2}
.tip .th{font:12px var(--mono);color:var(--mute);margin-bottom:4px}
.tip b{font:600 13px var(--mono);margin-left:8px;float:right}
.tview{border-top:1px solid var(--line);padding:10px 16px;font-size:14px}
.tview summary{cursor:pointer;color:var(--mute);font:12px var(--mono)}
.tbl{width:100%;border-collapse:collapse;margin-top:8px;font:13px var(--mono)}
.tbl th{text-align:right;font:600 11px var(--mono);color:var(--mute);padding:4px 0 6px;border-bottom:1px solid var(--line)}
.tbl td{text-align:right;padding:4px 0;border-bottom:1px solid var(--faint)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

.tokdot{fill:var(--accent);stroke:var(--panel);stroke-width:1.5}
.tokpill{fill:var(--accent)}
.toklabel{fill:#fff;font:600 11px var(--mono);pointer-events:none}

:root[data-theme=dark] .toklabel{fill:var(--bg)}

.fpic{overflow-x:auto;padding:8px;border-top:1px solid var(--line);background:var(--panel)}
.fpic svg{display:block;max-width:none}
.fpic .fllabel{fill:var(--ink);font:600 12px var(--sans)}
.fpic .flline{stroke:var(--line);stroke-dasharray:4 4}
.fpic .fharrow{stroke:var(--ink);stroke-width:1.6;fill:none}
.fpic .fhdot{fill:var(--ink)}
.fpic .fhlabel{fill:var(--ink);font:12px var(--mono)}
.fpic .fhband{fill:var(--accent);opacity:0;pointer-events:all;fill-opacity:0}
.fpic .fh{cursor:pointer}
.fpic .fh.done{opacity:.45}
.fpic .fh.todo{opacity:.2}
.fpic .fh.cur .fhband{opacity:.16;fill-opacity:1}
.fpic .fh.cur .fharrow{stroke:var(--accent);stroke-width:2.6}
.fpic .fh.cur .fhdot{fill:var(--accent)}
.fpic .fh.cur .fhlabel{fill:var(--accent);font-weight:600}
.fpic .fpmk{fill:var(--ink)}
.fpic .fpmkcur{fill:var(--accent)}
</style></head>

<script id="spec" type="application/json">{"kind":"hld","title":"Netflix recommendations","subtitle":"How Netflix picks the rows and titles on your home page, and why the work is split into three speeds.","idea":"Most of the work happens before you open the app. Heavy models run offline over everyone's history, quick updates run nearline right after you do something, and only a light final ranking runs online while you wait.","sections":[{"type":"text","title":"The big picture","body":["When you open Netflix, the home page is already personal: rows like \"Because you watched...\" filled with titles picked and ordered for you. Working that out from scratch while you wait would be far too slow. So Netflix splits the work by how fresh each part needs to be.","**Offline** jobs run in big batches, over hours, on everyone's viewing history. They train the models and precompute a list of candidate titles for every member. **Nearline** jobs react within seconds or minutes when you do something, like finishing an episode, and update your stored results. **Online** is the only part that runs while you wait: it takes the stored results and adjusts them using things only known right now, such as your device and the time of day.","This page follows the architecture Netflix described in its tech blog post [System Architectures for Personalization and Recommendation](https://netflixtechblog.com/system-architectures-for-personalization-and-recommendation-e081aa94b5d8) (Xavier Amatriain and Justin Basilico, 2013). The component names are theirs. The traffic and capacity numbers are illustrative, chosen to show how the parts behave, not Netflix's real figures."]},{"type":"arch","title":"The architecture","lede":"Start with **How it works**: pick a walkthrough and press Next. Then pick something to **Try** and watch what a viewer would notice. Click any box for what it does.","latencyBudget":200,"intro":"A normal evening. Pick a walkthrough above to see how a request or an event moves through the system.","groups":[{"id":"online","label":"Online","note":"while you wait, in milliseconds"},{"id":"nearline","label":"Nearline","note":"right after you act, in seconds to minutes"},{"id":"offline","label":"Offline","note":"in batches, over hours"},{"id":"store","label":"Stored results"}],"nodes":[{"id":"member","label":"You (the app)","icon":"phone","kind":"clients","rps":"=r.homeRps","group":"online","col":0,"row":0,"role":"The Netflix app on your TV, phone or laptop.","why":"It asks for your home page and reports what you do (play, pause, finish, rate) as events."},{"id":"api","label":"Netflix API","group":"online","col":1,"row":0,"instances":20,"cap":1000,"ms":5,"role":"The front door for every app request.","why":"Turns \"give me my home page\" into calls to the services that know the answer.","scale":"Stateless, add servers.","fails":"Overloaded if every request becomes expensive."},{"id":"online","label":"Online ranking","group":"online","col":2,"row":0,"instances":30,"cap":"=p.precompute ? (p.onlineRank ? 600 : 3000) : 40","ms":"=p.precompute ? (p.onlineRank ? 25 : 4) : 300","role":"Puts the final order on your rows while you wait.","why":"Uses fresh context that offline jobs cannot know: your device, the time of day, what you did a minute ago. It starts from stored candidates, so the work is small.","scale":"Add servers. Each one is cheap because the heavy work is already done.","fails":"If ranking would miss its deadline, it falls back to the stored list as it is. You still get a page."},{"id":"evcache","label":"EVCache","kind":"cache","group":"store","col":3,"row":0,"instances":12,"cap":10000,"ms":1,"hit":0.97,"role":"In-memory cache of your precomputed recommendations.","why":"Reading from memory takes about a millisecond, so the online step can afford to read many candidates.","scale":"Add memory and nodes.","fails":"A restart sends reads to Cassandra until it warms up."},{"id":"cassandra","label":"Cassandra","kind":"store","group":"store","col":3,"row":1,"instances":12,"cap":4000,"ms":6,"role":"Durable store for recommendation results.","why":"Durable, scalable store for results, so they survive if the cache is lost.","scale":"Add nodes; data is spread by member.","fails":"Slower than the cache, so it should only see cache misses on the read path."},{"id":"events","label":"Event stream","kind":"queue","group":"nearline","col":1,"row":1,"instances":30,"cap":10000,"ms":2,"role":"Carries small, time-sensitive messages: play, pause, finish, rate.","why":"Lets many jobs react to the same event without the app knowing about them. Netflix handled this event flow with Manhattan, an internal stream-processing framework similar to Twitter's Storm.","scale":"Add partitions.","fails":"If consumers fall behind, events wait in the queue."},{"id":"nearline","label":"Nearline jobs","icon":"worker","group":"nearline","col":2,"row":1,"instances":"=p.nearWorkers","cap":1200,"role":"Updates your stored recommendations right after you act.","why":"Finishing a show should change your home page now, not tomorrow. Nobody is waiting on this job, so it can do more work than the online step.","scale":"Add workers.","fails":"If events arrive faster than workers handle them, your home page stops reflecting what you just did. Nothing errors."},{"id":"logs","label":"Logs in Hadoop","icon":"storage","kind":"batch store","group":"offline","col":1,"row":2,"role":"Everyone's full history: every play, search and rating.","why":"Offline jobs need all of it. Netflix collected logs with Chukwa into Hadoop.","scale":"Add storage."},{"id":"jobs","label":"Offline jobs","icon":"batch","kind":"batch","group":"offline","col":2,"row":2,"role":"Train the models and precompute candidate lists for every member.","why":"With no one waiting, these jobs can use the most data and the heaviest models. Written in Hive and Pig on Hadoop; results were published to the online stores through Hermes, a publish-subscribe system.","scale":"More machines, or more hours.","fails":"If a nightly run fails, members get yesterday's baseline. Nothing errors."}],"edges":[{"from":"member","to":"api"},{"from":"api","to":"online","call":true},{"from":"online","to":"evcache","call":true},{"from":"evcache","to":"cassandra","miss":true,"label":"miss"},{"from":"member","to":"events","async":true,"share":"=r.eventRps/r.homeRps","label":"events"},{"from":"events","to":"nearline","async":true,"share":"=p.triggerShare*p.nearlineOn"},{"from":"nearline","to":"evcache","async":true,"label":"update"},{"from":"nearline","to":"cassandra","async":true},{"from":"events","to":"logs","async":true,"label":"log"},{"from":"logs","to":"jobs","async":true},{"from":"jobs","to":"cassandra","async":true,"share":"=p.precompute*0.02","label":"publish"}],"flows":[{"label":"You open the home page","steps":[{"path":["member","api"],"carry":"GET /home","text":"You open Netflix. The app asks the **Netflix API** for your home page: rows of titles, picked and ordered for you."},{"path":["api","online"],"carry":"rank request","text":"The API calls **online ranking**. This step has a strict time limit, because you are looking at a loading screen."},{"path":["online","evcache"],"carry":"read candidates","text":"Online ranking does not start from scratch. It reads the candidates already computed for you from **EVCache**, an in-memory cache. About a millisecond."},{"path":["evcache","cassandra"],"carry":"cache miss","text":"If they are not in the cache, they come from **Cassandra**, the durable store behind it. Slower, but rare: about 3% of reads here."},{"path":["online"],"text":"Now the light, fresh part: it re-orders the candidates using what it only knows now, such as your device and the time of day."},{"path":["online","api","member"],"carry":"your rows","text":"Your rows go back to the app. Almost all the work behind them was done before you opened it."}]},{"label":"You finish an episode","steps":[{"path":["member","events"],"carry":"▶ finished ep.","text":"The app sends an **event**: you finished an episode. Events are small messages about something that just happened."},{"path":["events","nearline"],"carry":"▶ finished ep.","text":"A **nearline job** picks the event up within seconds to minutes. You are not waiting on it, so it can do more work than the online step."},{"path":["nearline","evcache"],"carry":"new picks","text":"It recomputes the parts of your recommendations this event changes, for example dropping the show you finished and adding similar ones, and writes them to EVCache..."},{"path":["nearline","cassandra"],"carry":"new picks","text":"...and to Cassandra, so they survive a cache restart. Next time you open the home page, online ranking reads these fresh results."}]},{"label":"Every night","steps":[{"path":["member","events","logs"],"carry":"event log","text":"Every event is also logged. Over a day that is everyone's full history, stored in **Hadoop**."},{"path":["logs","jobs"],"carry":"viewing history","text":"**Offline jobs** run over all of it. They train the models and precompute a candidate list for every member. They can take hours, so they can use the most data and the heaviest models."},{"path":["jobs","cassandra"],"carry":"fresh baselines","text":"The results are published to the stored results. By morning every member has a fresh baseline, which nearline then keeps up to date during the day."}]},{"label":"When the live step is too slow","steps":[{"path":["member","api","online"],"carry":"GET /home","text":"Online ranking has a deadline. Sometimes ranking a page would take too long: a slow model, a busy server."},{"path":["online","evcache"],"carry":"stored list","text":"Then it **falls back**: it serves the stored list from the cache without the live adjustments. You still get a good page, just not tuned to this exact moment. Try the \"Online ranking too slow\" change."}]}],"presets":[{"label":"Normal evening","set":{},"note":"All three speeds on. Your page loads quickly and reflects what you did a minute ago."},{"label":"Turn off nearline","set":{"nearlineOn":0},"expect":"=!p.nearlineOn && m.err \u003c 0.001 && m.nodes.nearline.util \u003c 0.01 && m.lat \u003c 80","note":"Nothing breaks and nothing gets slower. But finish a show and it stays on your home page until the next nightly run. Watch \"New activity shows up\"."},{"label":"Big premiere night","set":{"surge":3},"expect":"=m.err \u003c 0.001 && m.nodes.events.util > 1 && m.nodes.nearline.util > 1","note":"Three times the usual events as everyone hits play at once. Pages still load. But the event stream is overloaded and the nearline workers fall behind, so your home page lags behind what you just did."},{"label":"Online ranking too slow","set":{"onlineRank":0},"expect":"=!p.onlineRank && m.err \u003c 0.001 && m.lat \u003c 40","note":"Online ranking falls back to the stored list. Pages get faster and nothing fails; you just lose the adjustments for this moment. Watch \"Your rows are\"."},{"label":"Skip precomputing, do it all live","set":{"precompute":0},"expect":"=m.nodes.online.util > 5 && m.err > 0.5 && m.lat > 1000","note":"Every page now runs the full models while you wait. Online ranking runs out of capacity, pages slow to a crawl and most fail. This is why the heavy work runs offline."}],"controls":[{"id":"nearlineOn","label":"Nearline updates","value":1,"min":0,"max":1,"step":1,"fmt":"onoff"},{"id":"onlineRank","label":"Live re-ranking","value":1,"min":0,"max":1,"step":1,"fmt":"onoff"},{"id":"precompute","label":"Precompute offline","value":1,"min":0,"max":1,"step":1,"fmt":"onoff"},{"id":"surge","label":"Event surge","value":1,"min":1,"max":5,"step":0.5,"unit":"x"},{"id":"nearWorkers","label":"Nearline workers","value":20,"min":2,"max":60,"step":1}],"metrics":[{"label":"New activity shows up","expr":"=p.nearlineOn ? (m.nodes.nearline.util \u003c 1 ? 'in ~1 min' : 'falling behind') : 'next day'","warn":"=!p.nearlineOn","bad":"=p.nearlineOn && m.nodes.nearline.util >= 1"},{"label":"Your rows are","expr":"=!p.precompute ? 'built live' : p.onlineRank ? 'tuned live' : 'stored list'","warn":"=p.precompute && !p.onlineRank"}]},{"type":"patterns","title":"Three speeds, side by side","lede":"The core idea of the design. Each speed does what the others cannot.","items":[{"name":"Offline","where":"Runs in batches over hours, on everyone's history.","why":"Can use the most data and the heaviest models, and costs least per result. But results are hours old, and it knows nothing about this moment."},{"name":"Nearline","where":"Runs seconds to minutes after you act, triggered by events.","why":"Fresh enough to react to what you just watched, without making you wait. Results are stored, so the online step can use them."},{"name":"Online","where":"Runs while you wait, in milliseconds.","why":"The only step that knows your device and the time right now. Must be light, so it re-orders stored candidates instead of computing from scratch, and falls back if it is late."},{"name":"Signals, models and data","where":"What every step combines.","why":"**Models** are trained offline. **Data** is prepared information, such as title metadata and popularity. **Signals** are fresh inputs, such as what you watched last and your device. Each speed uses the freshest inputs it can afford."}]},{"type":"tradeoffs","title":"The decisions that shape it","items":[{"question":"Where should recommendations be computed?","options":[{"name":"Everything online","pros":["Always uses the very latest signals"],"cons":["Heavy models on every page view: slow and expensive (try \"Skip precomputing\")"]},{"name":"Everything offline","pros":["Cheapest, simplest"],"cons":["Hours out of date: a show you just finished keeps being recommended (try \"Turn off nearline\")"]},{"name":"Layered: offline, nearline, online","pick":true,"pros":["Heavy work done once in batch","Fresh reactions within minutes","A light, fast final step"],"cons":["Three systems to build and keep consistent"]}],"why":"Each layer covers the others' weakness. The presets show what you lose when one is missing."},{"question":"Where do precomputed results live?","options":[{"name":"MySQL","pros":["Familiar, flexible queries"],"cons":["Hard to scale to this volume of writes from batch and nearline jobs"]},{"name":"Cassandra alone","pros":["Scales writes, durable"],"cons":["Slower reads than memory on every page load"]},{"name":"EVCache in front of Cassandra","pick":true,"pros":["Memory-speed reads","Durable copy if the cache is lost"],"cons":["Two stores to keep in step"]}],"why":"The read path needs memory speed and the results need a durable home. The blog post names all three stores and says each suits different data: MySQL for structured data, Cassandra for scalable storage, and EVCache for heavy, constant writes. The cache-in-front layout here is a simplification."}]},{"type":"failures","title":"What can go wrong","items":[{"what":"Nearline falls behind","effect":"Pages load fine, but they stop reflecting what you just did. No error anywhere.","mitigation":"Watch how far behind the event queue is. Before big releases, add event stream partitions as well as workers.","inject":{"surge":3}},{"what":"Online ranking is too slow","effect":"It falls back to the stored list. Pages still load, slightly less tuned to the moment.","mitigation":"This is the designed behaviour: a deadline plus a fallback, so a slow model never blocks your home page.","inject":{"onlineRank":0}},{"what":"The nightly job fails","effect":"Members get yesterday's baseline. Nearline keeps adding recent activity, so most people never notice.","mitigation":"Keep the last good results and alert when a run is late, rather than publishing partial results."},{"what":"Someone tries to do it all live","effect":"Every page runs the full models. Servers run out of capacity and pages fail.","mitigation":"Keep heavy work offline. Online only re-orders.","inject":{"precompute":0}}]},{"type":"estimation","title":"Go deeper: the numbers behind the simulator","lede":"Illustrative numbers, not Netflix's real ones. Drag them and the architecture above recomputes.","inputs":[{"id":"members","label":"Members active at peak","value":20000000,"min":1000000,"max":100000000,"log":true,"fmt":"si"},{"id":"loads","label":"Home page loads per member per hour","value":2,"min":0.5,"max":10,"step":0.5},{"id":"actions","label":"Events per member per hour (play, pause, rate, browse)","value":30,"min":5,"max":120,"step":5},{"id":"triggerShare","label":"Share of events that change recommendations","value":0.1,"min":0.01,"max":0.5,"step":0.01,"fmt":"pct"}],"rows":[{"id":"homeRps","label":"Home page requests","expr":"=p.members*p.loads/3600","fmt":"si","unit":"req/s","why":"The online path must answer every one of these within the time limit."},{"id":"eventRps","label":"Events","expr":"=p.members*p.actions/3600*p.surge","fmt":"si","unit":"events/s","why":"Many more events than page loads: most of what you do is not opening the home page."},{"id":"nearRps","label":"Events that trigger a nearline update","expr":"=r.eventRps*p.triggerShare*p.nearlineOn","fmt":"si","unit":"updates/s","why":"Finishing a show matters; pausing does not."},{"id":"liveServers","label":"Online servers needed if pages are tuned from stored lists","expr":"=ceil(r.homeRps/600/0.7)","fmt":"int","why":"One server handles about 600 pages a second, kept 70% busy."},{"id":"scratchServers","label":"Online servers needed if every page ran the full models","expr":"=ceil(r.homeRps/40/0.7)","fmt":"int","why":"About 40 pages a second each. This gap is why the heavy work is precomputed."}]},{"type":"qa","title":"Questions a learner asks","items":[{"q":"Why not just compute my recommendations when I open the app?","a":["Because the good models are heavy. Running them for every page view would need many times more servers and make you wait (compare the last two rows above). Precomputing does the heavy part once, ahead of time."]},{"q":"What is a \"model\" here?","a":["A function learned from everyone's viewing history that scores how likely you are to enjoy a title. It is trained offline, because training needs all the data and takes hours."]},{"q":"How does finishing a show change my home page so quickly?","a":["The app sends an event, a nearline job reacts within seconds to minutes and rewrites your stored results, and the next page load reads them. Try turning nearline off to see the difference."]},{"q":"Is this how Netflix works today?","a":["This page follows the architecture Netflix published in 2013. Their systems have changed since, but splitting work into offline, nearline and online stages is still a common way large recommendation systems are built."]}]}]}</script>

  var ICONS = {

    globe: '<circle class="p" cx="12" cy="12" r="9" stroke-width="1.6"/><ellipse class="n" cx="12" cy="12" rx="4" ry="9" stroke-width="1.2"/><path class="n" d="M3 12h18" stroke-width="1.2"/><circle class="g" cx="12" cy="12" r="1.4" stroke-width="1.6"/>',

  var iconsPlaced = false, afterAttach = []; // afterAttach: work that needs the page laid out (text measuring)
  function add(el, c) {

    if (Array.isArray(c)) c.forEach(function (x) { add(el, x); });
    else el.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
  }
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
  function md(s) { // tiny markdown: **bold**, `code`, [text](https://link)
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s"]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function paras(arr) { return (Array.isArray(arr) ? arr : [arr]).map(function (t) { return h("p", { html: md(t) }); }); }
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }

  var H = {
    min: Math.min, max: Math.max, ceil: Math.ceil, floor: Math.floor, round: Math.round,
    log2: Math.log2, log10: Math.log10, log: Math.log, pow: Math.pow, sqrt: Math.sqrt, abs: Math.abs, clamp: clamp,
    // Hit ratio of an ideal cache holding the c most popular of n items when popularity is Zipf(s).
    zipf: function (c, n, s) {
      c = Math.max(1, Math.min(c, n)); s = s == null ? 1 : s;
      return clamp(harmonic(c, s) / harmonic(n, s), 0, 1);
    }
  };
  // Generalised harmonic number sum(i^-s, i=1..k). Exact sum for the first terms, then the
  // Euler-Maclaurin tail. Accurate and continuous in s, including s = 1.
  function harmonic(k, s) {
    var m = Math.min(Math.floor(k), 32), sum = 0, i;
    for (i = 1; i <= m; i++) sum += Math.pow(i, -s);
    if (k <= m) return sum;
    var integral = Math.abs(s - 1) < 1e-9 ? Math.log(k / m) : (Math.pow(k, 1 - s) - Math.pow(m, 1 - s)) / (1 - s);
    return sum + integral + (Math.pow(k, -s) - Math.pow(m, -s)) / 2 + s * (Math.pow(m, -s - 1) - Math.pow(k, -s - 1)) / 12;
  }

    var f = cache[expr];
    if (!f) {

  // ----- code -----
  var KW = /\b(class|interface|enum|public|private|protected|static|final|abstract|extends|implements|return|if|else|for|while|new|this|self|def|fn|func|function|const|let|var|import|from|package|void|int|long|double|boolean|bool|string|String|None|null|true|false|True|False|throw|throws|try|catch|switch|case|break|continue|async|await|struct|type|impl|trait|pub|use|mut|lambda|and|or|not|in|is|with|as)\b/g;

  // ---------- page assembly ----------
  // hld: many machines and scale. lld: object design in one process. concept: how an

  if (!kinds.length) kinds = ["hld"];
