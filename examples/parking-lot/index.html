<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parking lot</title>
<style>:root{
  --bg:#f6f4ef; --panel:#fffdf8; --ink:#1c1b19; --mute:#6b675e; --line:#d9d4c7; --faint:#ece8dd;
  --accent:#c2410c; --cool:#2f7d5b; --warm:#c98a0b; --hot:#c0392b;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:ui-serif,Georgia,"Times New Roman",serif;
  /* chart series, fixed order (validated for colour-vision deficiency on --panel) */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
}
:root[data-theme=dark]{
  --bg:#141412; --panel:#1b1b18; --ink:#ece9e0; --mute:#9a958a; --line:#34322c; --faint:#24231f;
  --accent:#fb923c; --cool:#4ca97e; --warm:#e0a526; --hot:#e5584a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:48px;max-width:1180px;margin:0 auto;padding:0 28px}
nav.toc{position:sticky;top:0;align-self:start;height:100vh;padding:40px 0;overflow:auto;font-size:13px}
nav.toc .brand{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:18px}
nav.toc a{display:block;padding:5px 0 5px 12px;color:var(--mute);text-decoration:none;border-left:2px solid var(--line)}
nav.toc a:hover{color:var(--ink)}
nav.toc a.on{color:var(--ink);border-left-color:var(--accent)}
nav.toc button{margin-top:18px;font:12px var(--mono);background:none;border:1px solid var(--line);color:var(--mute);padding:4px 10px;border-radius:6px;cursor:pointer}
main{padding:56px 0 120px;min-width:0}
header.hero{margin-bottom:56px}
.kind{display:inline-block;font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);padding:2px 8px;border-radius:99px}
h1{font:600 clamp(32px,5vw,48px)/1.1 var(--serif);letter-spacing:-.02em;margin:16px 0 10px}
.sub{font-size:19px;color:var(--mute);max-width:60ch;margin:0}
.idea{margin:28px 0 0;padding:18px 22px;border-left:3px solid var(--accent);background:var(--panel);font:italic 20px/1.45 var(--serif);max-width:62ch}
.idea small{display:block;font:600 11px var(--mono);font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
section{margin:0 0 72px;scroll-margin-top:24px}
section>h2{font:600 26px/1.2 var(--serif);margin:0 0 6px;letter-spacing:-.01em}
section>h2 .n{font:500 12px var(--mono);color:var(--accent);margin-right:10px;vertical-align:middle}
section>.lede{color:var(--mute);margin:0 0 22px;max-width:64ch}
p{margin:0 0 14px;max-width:68ch}
code{font:.88em var(--mono);background:var(--faint);padding:1px 5px;border-radius:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card h3{font:600 12px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
.card ul{margin:0;padding-left:18px}
.card li{margin:4px 0}
.tag{font:11px var(--mono);color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-right:6px}
/* estimation */
.est{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px}
@media(max-width:820px){.est{grid-template-columns:1fr}}
.inp{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-bottom:14px;align-items:baseline}
.inp label{font-size:14px}
.inp output{font:13px var(--mono);color:var(--accent)}
.inp input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.rows{width:100%;border-collapse:collapse;font-size:14px}
.rows td{padding:7px 0;border-bottom:1px solid var(--faint)}
.rows td:last-child{text-align:right;font:14px var(--mono);white-space:nowrap}
.rows .why{display:block;font-size:12px;color:var(--mute)}
/* api + data */
.ep{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.ep .m{font:600 12px var(--mono);padding:2px 8px;border-radius:5px;background:var(--faint)}
.ep .m.POST,.ep .m.PUT,.ep .m.DELETE,.ep .m.PATCH{color:var(--accent)}
.ep .p{font:14px var(--mono)}
.ep .d{grid-column:2;color:var(--mute);font-size:14px}
.ep pre{grid-column:2;margin:4px 0 0}
pre{background:var(--faint);padding:10px 12px;border-radius:8px;overflow:auto;font:12.5px/1.5 var(--mono);margin:0}
table.cols{width:100%;border-collapse:collapse;font:13px var(--mono)}
table.cols td{padding:3px 8px 3px 0;vertical-align:top}
table.cols td.t{color:var(--mute)}
table.cols td.k{color:var(--accent);width:2.5em}
table.cols td.nt{color:var(--mute);font-family:var(--sans);font-size:12px}
.store{font:11px var(--mono);color:var(--mute);float:right}
/* sim */
.sim{padding:0;overflow:hidden}
.sim .bar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.chip{font:12px var(--mono);background:var(--faint);border:1px solid var(--line);color:var(--ink);padding:5px 10px;border-radius:99px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage{overflow-x:auto;padding:6px 8px}
.stage svg{display:block;min-width:720px;width:100%;height:auto}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border-top:1px solid var(--line)}
.metric{padding:12px 14px;border-right:1px solid var(--line)}
.metric:last-child{border-right:0}
.metric b{display:block;font:600 20px var(--mono)}
.metric span{font:11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.metric.bad b{color:var(--hot)}
.metric.warn b{color:var(--warm)}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 22px;padding:14px;border-top:1px solid var(--line)}
.simnote{padding:12px 16px;border-top:1px solid var(--line);font-size:14px;color:var(--mute);min-height:3.4em}
.simnote b{color:var(--ink)}
.node rect.box{stroke:var(--ink);stroke-width:1.2;rx:8;fill:color-mix(in srgb,var(--hot) calc(var(--u)*100%),var(--panel))}
.node.sel rect.box{stroke:var(--accent);stroke-width:2.4}
.node.dead rect.box{stroke:var(--hot);stroke-dasharray:4 3}
.node text{fill:var(--ink);font:600 14px var(--sans);pointer-events:none}
.node text.s{font:12px var(--mono);fill:var(--mute)}
.node:hover rect.box{stroke:var(--accent)}
.node{cursor:pointer}
.ubar{fill:var(--cool)}
.ubar.warn{fill:var(--warm)}.ubar.hot{fill:var(--hot)}
.edge{fill:none;stroke:var(--line);stroke-linecap:round}
.edge.async{stroke-dasharray:5 4}
.elabel{font:11.5px var(--mono);fill:var(--mute);paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.dot{fill:var(--accent)}
.dot.async{fill:var(--mute)}
.detail{padding:14px 16px;border-top:1px solid var(--line);font-size:14px;display:grid;gap:4px 18px;grid-template-columns:auto 1fr}
.detail dt{font:11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding-top:2px}
.detail dd{margin:0}
/* tradeoffs, failures, qa */
.opt{display:flex;flex-direction:column;gap:6px}
.opt.pick{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.opt h4{margin:0;font:600 16px var(--serif)}
.opt .badge{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.pro::before{content:"+ ";color:var(--cool);font-family:var(--mono)}
.con::before{content:"– ";color:var(--hot);font-family:var(--mono)}
.q{margin:0 0 6px}
.q summary{cursor:pointer;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-weight:600}
.q[open] summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
.q .a{padding:12px 16px;border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;background:var(--panel)}
.fail h4{margin:0 0 6px;font:600 15px var(--sans)}
.fail dl{margin:0;font-size:14px}.fail dt{font:11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-top:8px}.fail dd{margin:0}
/* lld */
.diagram{padding:10px;overflow-x:auto}
.diagram svg{display:block;margin:0 auto;max-width:100%;height:auto}
.cls rect{fill:var(--panel);stroke:var(--ink);stroke-width:1.2}
.cls .hd{fill:var(--faint)}
.cls text{font:12px var(--mono);fill:var(--ink)}
.cls text.h{font:600 13px var(--sans)}
.cls text.st{font:italic 10.5px var(--mono);fill:var(--mute)}
.cls{cursor:pointer}
.cls.sel rect.fr{stroke:var(--accent);stroke-width:2.4}
.rel{stroke:var(--ink);fill:none;stroke-width:1.2}
.rel.dash{stroke-dasharray:5 4}
.rl{font:10.5px var(--mono);fill:var(--mute);paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.life{stroke:var(--line);stroke-dasharray:4 4}
.actor rect{fill:var(--panel);stroke:var(--ink);stroke-width:1.2;rx:6}
.actor text{font:600 12.5px var(--sans);fill:var(--ink)}
.msg{transition:opacity .2s}
.msg.off{opacity:.22}
.msg line,.msg path{stroke:var(--ink);fill:none;stroke-width:1.3}
.msg.ret line{stroke-dasharray:5 4}
.msg.on line,.msg.on path{stroke:var(--accent);stroke-width:2}
.msg text{font:12px var(--mono);fill:var(--ink)}
.msg.on text{fill:var(--accent)}
.st rect.sb{fill:var(--panel);stroke:var(--ink);stroke-width:1.2}
.stn text{font:600 13px var(--sans);fill:var(--ink)}
.stn.cur rect.sb{fill:var(--ink)}.stn.cur text{fill:var(--bg)}
.stn.term rect.sb{stroke-width:2.6}
.tr{stroke:var(--ink);fill:none;stroke-width:1.2}
.tr.live{stroke:var(--accent);stroke-width:2.2}
.tl{font:11px var(--mono);fill:var(--mute);paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.ctl .grow{flex:1;color:var(--mute);font-size:14px;min-width:200px}
.steps{display:grid;grid-template-columns:220px minmax(0,1fr);}
@media(max-width:820px){.steps{grid-template-columns:1fr}}
.steps ol{list-style:none;margin:0;padding:8px;border-right:1px solid var(--line);max-height:420px;overflow:auto}
.steps li button{width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 10px;font:12.5px var(--mono);color:var(--mute);cursor:pointer}
.steps li button.on{background:var(--ink);color:var(--bg)}
.steps .pane{padding:16px 18px}
.steps .call{font:14px var(--mono);margin:0 0 8px}
.kv{width:100%;border-collapse:collapse;font:13px var(--mono);margin-top:10px}
.kv td{padding:4px 8px;border-bottom:1px solid var(--faint);vertical-align:top}
.kv td:first-child{color:var(--mute);width:34%}
.kv tr.chg td:last-child{color:var(--accent);font-weight:600}
.tabs{display:flex;gap:4px;padding:8px 8px 0;border-bottom:1px solid var(--line)}
.tabs button{font:12px var(--mono);background:none;border:0;border-bottom:2px solid transparent;padding:6px 10px;color:var(--mute);cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
pre.code{border-radius:0 0 12px 12px;background:var(--panel);padding:14px 0;counter-reset:l;max-height:560px}
pre.code .ln{display:block;padding:0 16px 0 0;white-space:pre}
pre.code .ln::before{counter-increment:l;content:counter(l);display:inline-block;width:3em;padding-right:14px;text-align:right;color:var(--mute);opacity:.6}
.tk-k{color:var(--accent)}.tk-s{color:var(--cool)}.tk-c{color:var(--mute);font-style:italic}.tk-n{color:var(--warm)}
footer{color:var(--mute);font:12px var(--mono);border-top:1px solid var(--line);padding-top:18px}
@media(max-width:900px){.wrap{grid-template-columns:1fr;gap:0;padding:0 18px}nav.toc{display:none}}
/* chart */
.viz .ctrls.top{border-top:0;border-bottom:1px solid var(--line)}
.plot{position:relative;padding:8px 6px 0}
.plot svg{display:block;width:100%;height:auto;touch-action:pan-y}
.plot text{font:11px var(--mono);fill:var(--mute)}
.plot .an{font:12px var(--sans);fill:var(--mute)}
.plot .cg{stroke:var(--faint)}
.plot .ca{stroke:var(--line)}
.plot .cs{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.plot .cl{font:12px var(--sans);fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.plot .cm{stroke:var(--ink);stroke-dasharray:3 3;opacity:.45}
.plot .cmt{font:600 11px var(--mono);fill:var(--ink)}
.plot .cx{stroke:var(--mute);opacity:0;pointer-events:none}
.plot .cd{stroke:var(--panel);stroke-width:2;pointer-events:none}
.cs.s0{stroke:var(--s1)}.cs.s1{stroke:var(--s2)}.cs.s2{stroke:var(--s3)}.cs.s3{stroke:var(--s4)}
.cd.s0{fill:var(--s1)}.cd.s1{fill:var(--s2)}.cd.s2{fill:var(--s3)}.cd.s3{fill:var(--s4)}
.legend i,.tip i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:7px}
i.s0{background:var(--s1)}i.s1{background:var(--s2)}i.s2{background:var(--s3)}i.s3{background:var(--s4)}
.legend{display:flex;flex-wrap:wrap;gap:6px 22px;padding:10px 16px 12px;font-size:14px}
.legend b{font:600 14px var(--mono);margin-left:8px}
.tip{position:absolute;display:none;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.12);min-width:170px;z-index:2}
.tip .th{font:12px var(--mono);color:var(--mute);margin-bottom:4px}
.tip b{font:600 13px var(--mono);margin-left:8px;float:right}
.tview{border-top:1px solid var(--line);padding:10px 16px;font-size:14px}
.tview summary{cursor:pointer;color:var(--mute);font:12px var(--mono)}
.tbl{width:100%;border-collapse:collapse;margin-top:8px;font:13px var(--mono)}
.tbl th{text-align:right;font:600 11px var(--mono);color:var(--mute);padding:4px 0 6px;border-bottom:1px solid var(--line)}
.tbl td{text-align:right;padding:4px 0;border-bottom:1px solid var(--faint)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head>

<script id="spec" type="application/json">{"kind":"lld","title":"Parking lot","subtitle":"Which spot does a vehicle get, what does the stay cost, and how do you keep the design open to change.","idea":"Keep the lot's bookkeeping dull and push every policy question, which spot and what price, behind a small interface so each can change on its own.","sections":[{"type":"requirements","title":"What we are building","functional":["Vehicles of three types (motorcycle, car, truck) enter and receive a ticket.","Each vehicle is assigned a free spot it fits in.","On exit the ticket is turned into a fee based on time and spot size.","The lot knows when it is full for a given vehicle type."],"nonfunctional":["Adding a pricing rule or allocation rule must not change ParkingLot.","Two gates must never assign the same spot.","All state needed to price a stay is on the ticket."],"outOfScope":["Payment processing","Reservations","Multi-lot routing"]},{"type":"classes","title":"Classes and relationships","lede":"Click a class for its role.","hint":"Click a class for its role. The two strategy interfaces are where the design bends.","classes":[{"name":"ParkingLot","at":[1,0],"fields":["spots: Spot[]","tickets: Map\u003cid, Ticket>","allocator: AllocationStrategy","pricing: PricingStrategy"],"methods":["park(vehicle, now): Ticket","unpark(ticketId, now): fee"],"role":"The only class with state that changes. It coordinates and decides nothing about policy: it asks the allocator for a spot and the pricing strategy for a fee."},{"name":"Spot","at":[0,0],"fields":["id","size: S | M | L","level","plate: string | null"],"methods":["free: boolean"],"role":"One physical space. Knows its size and who is in it."},{"name":"Ticket","at":[2,0],"fields":["id","plate","spotId","entry: seconds"],"methods":[],"role":"A receipt that carries everything needed to price the stay later, so pricing never has to look anything up."},{"name":"Vehicle","at":[0,1],"fields":["plate","type"],"methods":[],"role":"Input to the lot. Only its type matters for fitting."},{"name":"AllocationStrategy","at":[1,1],"stereotype":"interface","fields":[],"methods":["pick(spots, vehicle): Spot | null"],"role":"Policy: which free spot. Swap it to prefer low levels, spread wear, or keep large spots free."},{"name":"SmallestFit","at":[1,2],"fields":[],"methods":["pick(spots, vehicle)"],"role":"The default: the smallest free spot that fits, nearest level first."},{"name":"PricingStrategy","at":[2,1],"stereotype":"interface","fields":[],"methods":["charge(ticket, spot, exit): fee"],"role":"Policy: what a stay costs. Hourly today; flat, tiered or surge tomorrow."},{"name":"HourlyPricing","at":[2,2],"fields":["rate: size -> per hour"],"methods":["charge(ticket, spot, exit)"],"role":"Rounds the stay up to whole hours, minimum one, times the rate for the spot size."}],"relations":[{"from":"ParkingLot","to":"Spot","type":"has","label":"1..*"},{"from":"ParkingLot","to":"Ticket","type":"has","label":"0..*"},{"from":"ParkingLot","to":"AllocationStrategy","type":"uses"},{"from":"ParkingLot","to":"PricingStrategy","type":"uses"},{"from":"SmallestFit","to":"AllocationStrategy","type":"implements"},{"from":"HourlyPricing","to":"PricingStrategy","type":"implements"},{"from":"Vehicle","to":"AllocationStrategy","type":"uses"}]},{"type":"sequence","title":"Parking a vehicle","hint":"Press play. Each step shows what that message is for.","actors":["Gate","ParkingLot","Allocator","Spot"],"messages":[{"from":"Gate","to":"ParkingLot","text":"park(vehicle, now)","note":"A gate hands over the vehicle and the current time."},{"from":"ParkingLot","to":"ParkingLot","text":"reject duplicate plate","note":"Fail fast: a plate that already has a ticket cannot park again."},{"from":"ParkingLot","to":"Allocator","text":"pick(spots, vehicle)","note":"Policy lives here. The lot does not know how a spot is chosen."},{"from":"Allocator","to":"ParkingLot","text":"spot or null","ret":true,"note":"Null means nothing fits. The lot raises LotFull."},{"from":"ParkingLot","to":"Spot","text":"occupy(plate)","note":"This write is the one that must be atomic if two gates run at once (see the concurrency answer below)."},{"from":"ParkingLot","to":"Gate","text":"Ticket","ret":true,"note":"The ticket carries the entry time. Pricing later needs nothing else."}]},{"type":"states","title":"Life of a spot","lede":"Fire events. The machine only allows the transitions in its table, the same table the code enforces.","initial":"free","states":[{"id":"free","label":"Free","at":[1,0],"note":"Available to the allocator."},{"id":"occupied","label":"Occupied","at":[2,0],"note":"A ticket points at this spot."},{"id":"reserved","label":"Reserved","at":[0,0],"note":"Held for a booking (an extension, not built here)."},{"id":"oos","label":"Out of service","at":[1,1],"note":"Skipped by every allocator."}],"transitions":[{"from":"free","to":"occupied","event":"park","note":"ticket issued"},{"from":"occupied","to":"free","event":"unpark","note":"fee charged, ticket closed"},{"from":"free","to":"oos","event":"close"},{"from":"oos","to":"free","event":"reopen"},{"from":"free","to":"reserved","event":"reserve"},{"from":"reserved","to":"occupied","event":"arrive","bend":-62},{"from":"reserved","to":"free","event":"expire"}]},{"type":"scenario","title":"Run it","lede":"These steps were produced by running the reference implementation. Changed values are highlighted.","steps":[{"title":"Empty lot","call":"makeLot()","note":"Two small, two medium and one large spot, one level.","state":{"S1 (S)":"free","S2 (S)":"free","M1 (M)":"free","M2 (M)":"free","L1 (L)":"free","open tickets":0}},{"title":"Motorcycle arrives","call":"park(motorcycle \"MC-1\", t=0)","result":"S1","note":"The allocator picks the smallest spot that fits, so the motorcycle takes a small one and leaves bigger spots for bigger vehicles.","state":{"S1 (S)":"MC-1","S2 (S)":"free","M1 (M)":"free","M2 (M)":"free","L1 (L)":"free","open tickets":1}},{"title":"Car arrives","call":"park(car \"CAR-1\", t=60)","result":"M1","state":{"S1 (S)":"MC-1","S2 (S)":"free","M1 (M)":"CAR-1","M2 (M)":"free","L1 (L)":"free","open tickets":2}},{"title":"Second car","call":"park(car \"CAR-2\", t=120)","result":"M2","state":{"S1 (S)":"MC-1","S2 (S)":"free","M1 (M)":"CAR-1","M2 (M)":"CAR-2","L1 (L)":"free","open tickets":3}},{"title":"Third car","call":"park(car \"CAR-3\", t=180)","result":"L1","note":"Medium spots are gone, so the car takes the large spot. Legal, but it is the design's weak point.","state":{"S1 (S)":"MC-1","S2 (S)":"free","M1 (M)":"CAR-1","M2 (M)":"CAR-2","L1 (L)":"CAR-3","open tickets":4}},{"title":"Truck arrives","call":"park(truck \"TRK-1\", t=240)","result":"LotFull: no free spot for a truck","note":"A free small spot exists, but a truck fits only in a large one. The lot is full for trucks while three spots sit idle.","state":{"S1 (S)":"MC-1","S2 (S)":"free","M1 (M)":"CAR-1","M2 (M)":"CAR-2","L1 (L)":"CAR-3","open tickets":4}},{"title":"Third car leaves","call":"unpark(ticket 4, t=7800)","result":"fee = 12","note":"2h10m rounds up to 3 hours at 4 per hour for a large spot.","state":{"S1 (S)":"MC-1","S2 (S)":"free","M1 (M)":"CAR-1","M2 (M)":"CAR-2","L1 (L)":"free","open tickets":3}},{"title":"Truck retries","call":"park(truck \"TRK-1\", t=7900)","result":"L1","state":{"S1 (S)":"MC-1","S2 (S)":"free","M1 (M)":"CAR-1","M2 (M)":"CAR-2","L1 (L)":"TRK-1","open tickets":4}},{"title":"Same car twice","call":"park(car \"CAR-1\", t=8000)","result":"Error: CAR-1 is already parked","note":"A plate that already holds a ticket is rejected before any spot is touched.","state":{"S1 (S)":"MC-1","S2 (S)":"free","M1 (M)":"CAR-1","M2 (M)":"CAR-2","L1 (L)":"TRK-1","open tickets":4}}]},{"type":"code","title":"The code","lede":"This is the exact file that produced the scenario above.","files":[{"name":"lot.mjs","src":"// Reference implementation. The page runs this file to produce its scenario steps,\n// and shows this same file in the code tab, so what you read is what ran.\n\nconst FITS = { motorcycle: [\"S\", \"M\", \"L\"], car: [\"M\", \"L\"], truck: [\"L\"] };\nconst RANK = { S: 0, M: 1, L: 2 };\n\nexport class LotFull extends Error {}\nexport class UnknownTicket extends Error {}\n\nexport class Vehicle {\n  constructor(plate, type) { this.plate = plate; this.type = type; }\n}\n\nexport class Spot {\n  constructor(id, size, level) { this.id = id; this.size = size; this.level = level; this.plate = null; }\n  get free() { return this.plate === null; }\n}\n\nexport class Ticket {\n  constructor(id, plate, spotId, entry) { this.id = id; this.plate = plate; this.spotId = spotId; this.entry = entry; }\n}\n\n// Strategy: which free spot does a vehicle get?\nexport class SmallestFit {\n  pick(spots, vehicle) {\n    return spots\n      .filter((s) => s.free && FITS[vehicle.type].includes(s.size))\n      .sort((a, b) => RANK[a.size] - RANK[b.size] || a.level - b.level || a.id.localeCompare(b.id))[0] ?? null;\n  }\n}\n\n// Strategy: what does a stay cost?\nexport class HourlyPricing {\n  constructor(ratePerHour) { this.rate = ratePerHour; }\n  charge(ticket, spot, exitSec) {\n    const hours = Math.max(1, Math.ceil((exitSec - ticket.entry) / 3600));\n    return hours * this.rate[spot.size];\n  }\n}\n\nexport class ParkingLot {\n  constructor(spots, allocator, pricing) {\n    this.spots = spots; this.allocator = allocator; this.pricing = pricing;\n    this.tickets = new Map(); this.nextId = 1;\n  }\n  park(vehicle, nowSec) {\n    for (const t of this.tickets.values()) if (t.plate === vehicle.plate) throw new Error(`${vehicle.plate} is already parked`);\n    const spot = this.allocator.pick(this.spots, vehicle);\n    if (!spot) throw new LotFull(`no free spot for a ${vehicle.type}`);\n    spot.plate = vehicle.plate;\n    const ticket = new Ticket(this.nextId++, vehicle.plate, spot.id, nowSec);\n    this.tickets.set(ticket.id, ticket);\n    return ticket;\n  }\n  unpark(ticketId, nowSec) {\n    const ticket = this.tickets.get(ticketId);\n    if (!ticket) throw new UnknownTicket(`ticket ${ticketId}`);\n    const spot = this.spots.find((s) => s.id === ticket.spotId);\n    const fee = this.pricing.charge(ticket, spot, nowSec);\n    spot.plate = null;\n    this.tickets.delete(ticketId);\n    return fee;\n  }\n  snapshot() {\n    const out = {};\n    for (const s of this.spots) out[`${s.id} (${s.size})`] = s.plate ?? \"free\";\n    out[\"open tickets\"] = this.tickets.size;\n    return out;\n  }\n}\n\nexport function makeLot() {\n  const spots = [\n    new Spot(\"S1\", \"S\", 1), new Spot(\"S2\", \"S\", 1),\n    new Spot(\"M1\", \"M\", 1), new Spot(\"M2\", \"M\", 1),\n    new Spot(\"L1\", \"L\", 1),\n  ];\n  return new ParkingLot(spots, new SmallestFit(), new HourlyPricing({ S: 1, M: 2, L: 4 }));\n}\n"}]},{"type":"patterns","title":"Patterns used, and why","items":[{"name":"Strategy (allocation)","where":"`AllocationStrategy` and `SmallestFit`.","why":"Spot choice is the part most likely to change. Behind an interface, a new rule is a new class, not an edit to ParkingLot."},{"name":"Strategy (pricing)","where":"`PricingStrategy` and `HourlyPricing`.","why":"Same reasoning, and prices change for business reasons far more often than the lot changes."},{"name":"Value object","where":"`Ticket`.","why":"It carries the entry time and spot, so charging a fee needs no second lookup and cannot disagree with what was recorded."},{"name":"Not used: inheritance for vehicles","where":"`Vehicle` is one class with a type field.","why":"The three types differ only in which sizes they fit. A class hierarchy would add structure with no behaviour to put in it."}]},{"type":"qa","title":"What an interviewer asks next","items":[{"q":"How do you make park() safe with two gates?","a":["The dangerous window is between picking a spot and marking it taken. Make that one atomic step: a lock around the allocation, or a compare-and-set on the spot (set plate only if it is still empty) with a retry on failure. A per-spot lock scales better than one lock on the whole lot, but then `pick` must tolerate a spot being taken underneath it."]},{"q":"The scenario shows a car taking the last large spot. Is that a bug?","a":["It is a policy question, which is why it lives in the strategy. A stricter allocator could refuse to place cars in large spots while any truck demand exists, or keep a reserve count of large spots. The lot class would not change."]},{"q":"How do you add EV charging spots?","a":["Add a spot attribute and let the allocator filter on it, or add a new size-like category. If a vehicle needs charging, the allocator looks for spots with a charger first. ParkingLot is unchanged because it never looks inside the choice."]},{"q":"What if the lot has thousands of spots?","a":["Scanning every spot on each arrival is linear. Keep a free list per size, ordered by level, and pick from the front. The strategy interface stays the same; only SmallestFit's internals change."]}]}]}</script>
<script>/* sysdesign runtime. Renders a page from the JSON spec in <script id="spec">.
   No dependencies. Everything on the page is computed from the spec's own
   inputs and formulas, so numbers in prose, tables and the simulation agree. */
(function () {
  "use strict";
  var SPEC = JSON.parse(document.getElementById("spec").textContent);
  var S = { p: {}, r: {}, m: null }; // params, estimation rows, last sim result
  var listeners = [];
  var SVG = "http://www.w3.org/2000/svg";

  // ---------- helpers ----------
  function h(tag, attrs) {
    var svg = /^(svg|g|path|rect|circle|line|text|marker|defs|polygon|tspan|clipPath)$/.test(tag);
    var el = svg ? document.createElementNS(SVG, tag) : document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "class") el.setAttribute("class", v);
      else if (k === "html") el.innerHTML = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) c.forEach(function (x) { add(el, x); });
    else el.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
  }
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
  function md(s) { // tiny markdown: **bold**, `code`
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  }
  function paras(arr) { return (Array.isArray(arr) ? arr : [arr]).map(function (t) { return h("p", { html: md(t) }); }); }
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }

  var H = {
    min: Math.min, max: Math.max, ceil: Math.ceil, floor: Math.floor, round: Math.round,
    log2: Math.log2, log10: Math.log10, log: Math.log, pow: Math.pow, sqrt: Math.sqrt, abs: Math.abs, clamp: clamp,
    // Hit ratio of an ideal cache holding the c most popular of n items when popularity is Zipf(s).
    zipf: function (c, n, s) {
      c = Math.max(1, Math.min(c, n)); s = s == null ? 1 : s;
      return clamp(harmonic(c, s) / harmonic(n, s), 0, 1);
    }
  };
  // Generalised harmonic number sum(i^-s, i=1..k). Exact sum for the first terms, then the
  // Euler-Maclaurin tail. Accurate and continuous in s, including s = 1.
  function harmonic(k, s) {
    var m = Math.min(Math.floor(k), 32), sum = 0, i;
    for (i = 1; i <= m; i++) sum += Math.pow(i, -s);
    if (k <= m) return sum;
    var integral = Math.abs(s - 1) < 1e-9 ? Math.log(k / m) : (Math.pow(k, 1 - s) - Math.pow(m, 1 - s)) / (1 - s);
    return sum + integral + (Math.pow(k, -s) - Math.pow(m, -s)) / 2 + s * (Math.pow(m, -s - 1) - Math.pow(k, -s - 1)) / 12;
  }
  var cache = {};
  // Evaluate "=expr". Expressions read p (params), r (rows), m (simulation result) and,
  // inside a chart, x (the value on the horizontal axis).
  function val(expr, extra, xv) {
    if (typeof expr !== "string" || expr.charAt(0) !== "=") return expr;
    var f = cache[expr];
    if (!f) {
      try { f = cache[expr] = new Function("p", "r", "m", "H", "x", "with(H){return (" + expr.slice(1) + ")}"); }
      catch (e) { fail("bad expression " + expr + ": " + e.message); f = cache[expr] = function () { return 0; }; }
    }
    try { var v = f(S.p, S.r, extra || S.m, H, xv); return v == null || isNaN(v) && typeof v === "number" ? 0 : v; }
    catch (e) { fail("expression " + expr + ": " + e.message); return 0; }
  }
  function fail(msg) { document.body.dataset.error = (document.body.dataset.error || "") + msg + " | "; }
  function fmt(v, f, unit) {
    if (typeof v !== "number") return String(v);
    var s;
    if (f === "pct") s = (v * 100).toFixed(v < 0.1 ? 2 : 1) + "%";
    else if (f === "bytes") s = scale(v, ["B", "KB", "MB", "GB", "TB", "PB", "EB"], 1000);
    else if (f === "ms") s = v < 10 ? v.toFixed(1) + " ms" : Math.round(v) + " ms";
    else if (f === "onoff") return v ? "On" : "Off";
    else if (f === "int") s = Math.round(v).toLocaleString("en-US");
    else s = si(v);
    return unit && f !== "bytes" && f !== "ms" && f !== "pct" ? s + " " + unit : s;
  }
  function si(v) {
    var a = Math.abs(v);
    if (a >= 1e12) return (v / 1e12).toFixed(2).replace(/\.?0+$/, "") + "T";
    if (a >= 1e9) return (v / 1e9).toFixed(2).replace(/\.?0+$/, "") + "B";
    if (a >= 1e6) return (v / 1e6).toFixed(2).replace(/\.?0+$/, "") + "M";
    if (a >= 1e4) return (v / 1e3).toFixed(1).replace(/\.?0+$/, "") + "K";
    if (a >= 100) return Math.round(v).toLocaleString("en-US");
    if (a >= 1) return v.toFixed(1).replace(/\.0$/, "");
    if (a === 0) return "0";
    return v.toPrecision(2);
  }
  function scale(v, units, base) { var i = 0; while (Math.abs(v) >= base && i < units.length - 1) { v /= base; i++; } return v.toFixed(v < 10 ? 1 : 0).replace(/\.0$/, "") + " " + units[i]; }

  // ---------- reactive store ----------
  function declareParams() {
    (SPEC.sections || []).forEach(function (s) {
      (s.inputs || []).concat(s.controls || []).forEach(function (c) { if (c.id && c.value != null) S.p[c.id] = c.value; });
    });
  }
  var DEFAULTS = {};
  function onChange(fn) { listeners.push(fn); }
  function readsSim(row) { return typeof row.expr === "string" && /\bm\./.test(row.expr); }
  // Rows that do not read the simulation are computed first, so the simulation can use them.
  // Rows that read it are computed after, against that run's result (never a stale one).
  function computeRows(simPass, m) {
    (SPEC.sections || []).forEach(function (s) {
      (s.rows || []).forEach(function (row) { if (row.id && readsSim(row) === simPass) S.r[row.id] = val(row.expr, m); });
    });
  }
  function archSection() { return (SPEC.sections || []).filter(function (s) { return s.type === "arch"; })[0]; }
  function recompute() {
    computeRows(false, null);
    var arch = archSection();
    S.m = arch ? simulate(arch) : null;
    computeRows(true, S.m);
    listeners.forEach(function (f) { f(); });
    if (S.m) document.body.dataset.sim = JSON.stringify({ rps: S.m.rps, err: S.m.err, lat: S.m.lat, bottleneck: S.m.bottleneck });
  }
  // any slider (estimation or simulator) can make a preset chip stop matching, so re-check them
  function setParam(id, v) { S.p[id] = v; recompute(); presetHooks.forEach(function (f) { f(); }); }

  // ---------- fluid flow simulation ----------
  // A request rate enters at source nodes and is split along edges. Each node serves up to
  // instances x capacity requests per second; the rest is shed. Latency per node is the
  // service time stretched by 1/(1-utilisation), the M/M/1 shape. Cache nodes terminate
  // `hit` of their traffic. Async edges load their targets but are not on the user's path.
  function simulate(arch) {
    var nodes = arch.nodes, by = {}, i;
    nodes.forEach(function (n) { by[n.id] = n; });
    var out = {}, inn = {};
    nodes.forEach(function (n) { out[n.id] = []; inn[n.id] = []; });
    arch.edges.forEach(function (e) { out[e.from].push(e); inn[e.to].push(e); });
    // topological order
    var indeg = {}, order = [], q = [];
    nodes.forEach(function (n) { indeg[n.id] = inn[n.id].length; if (!indeg[n.id]) q.push(n.id); });
    while (q.length) { var id = q.shift(); order.push(id); out[id].forEach(function (e) { if (--indeg[e.to] === 0) q.push(e.to); }); }
    if (order.length !== nodes.length) { fail("architecture has a cycle"); return null; }
    var res = { nodes: {}, edges: [] };
    var flow = {}; // edge index -> rps
    arch.edges.forEach(function (e, k) { e._k = k; });
    order.forEach(function (id) {
      var n = by[id], r = res.nodes[id] = { id: id };
      var inflow = n.rps != null ? val(n.rps) : 0;
      inn[id].forEach(function (e) { inflow += flow[e._k] || 0; });
      var inst = n.instances != null ? Math.max(0, val(n.instances)) : 1;
      var cap = n.cap != null ? val(n.cap) : Infinity;
      var total = inst * cap;
      var acc = Math.min(inflow, total);
      var rho = total === Infinity ? 0 : total > 0 ? inflow / total : (inflow > 0 ? 9 : 0);
      var svc = n.ms != null ? val(n.ms) : 0;
      r.inflow = inflow; r.inst = inst; r.cap = cap; r.total = total;
      r.accepted = acc; r.shed = inflow - acc; r.util = rho; r.accFrac = inflow > 0 ? acc / inflow : 1;
      r.latency = svc ? svc / (1 - Math.min(rho, 0.97)) : 0;
      r.hit = n.hit != null ? clamp(val(n.hit), 0, 1) : 0;
      r.growth = n.kind === "queue" && inflow > total ? inflow - total : 0; // backlog growth per second
      // split accepted traffic across outgoing edges
      var outs = out[id], eq = outs.filter(function (e) { return e.share == null && !e.call && !e.async; }).length;
      outs.forEach(function (e) {
        var sh = e.share != null ? val(e.share) : (e.call || e.async) ? 1 : 1 / Math.max(1, eq);
        if (e.miss) sh *= (1 - r.hit);
        var mult = e.mult != null ? val(e.mult) : 1;
        flow[e._k] = acc * sh * mult;
        res.edges[e._k] = { flow: flow[e._k], share: sh, mult: mult };
      });
    });
    // success probability and expected latency of a request entering each node (sync edges only)
    var memo = {};
    function path(id) {
      if (memo[id]) return memo[id];
      var r = res.nodes[id], sync = out[id].filter(function (e) { return !e.async; });
      var alts = sync.filter(function (e) { return !e.call; }), calls = sync.filter(function (e) { return e.call; });
      var s = 0, l = r.latency, cover = 0;
      alts.forEach(function (e) {
        var sh = res.edges[e._k].share, c = path(e.to);
        s += sh * c.s; l += sh * c.l; cover += sh;
      });
      var hitShare = r.hit && alts.some(function (e) { return e.miss; }) ? r.hit : 0;
      s += hitShare; cover += hitShare;
      if (!alts.length) s = 1; else if (cover < 1) s += 1 - cover; // traffic with nowhere to go ends here, successfully
      calls.forEach(function (e) { // calls every request may make: all must succeed, latencies add
        var sh = res.edges[e._k].share, c = path(e.to);
        s *= (1 - sh) + sh * c.s; l += sh * c.l;
      });
      return memo[id] = { s: s * r.accFrac, l: l };
    }
    var srcs = nodes.filter(function (n) { return n.rps != null; }), tot = 0, ok = 0, lat = 0;
    srcs.forEach(function (n) {
      if (n.internal) return;
      var rate = res.nodes[n.id].inflow, p = path(n.id); tot += rate; ok += rate * p.s; lat += rate * p.l;
      res.nodes[n.id].path = p;
    });
    res.rps = tot; res.served = ok; res.err = tot > 0 ? 1 - ok / tot : 0; res.lat = tot > 0 ? lat / tot : 0;
    var worst = null;
    nodes.forEach(function (n) { var r = res.nodes[n.id]; if (r.total !== Infinity && (!worst || r.util > res.nodes[worst].util)) worst = n.id; });
    res.bottleneck = worst;
    return res;
  }

  // ---------- sections ----------
  var builders = {};

  builders.text = function (s) { return [paras(s.body || [])]; };

  builders.requirements = function (s) {
    function col(t, items) { return h("div", { class: "card" }, h("h3", null, t), h("ul", null, (items || []).map(function (x) { return h("li", { html: md(x) }); }))); }
    return [h("div", { class: "grid g3" }, col("Functional", s.functional), col("Non-functional", s.nonfunctional), s.outOfScope ? col("Out of scope", s.outOfScope) : null)];
  };

  // One labelled slider bound to param c.id. It follows the param when a preset changes it.
  function slider(c, defStep) {
    var o = h("output"), inp = h("input", { type: "range", min: c.min, max: c.max, step: c.step || defStep, "aria-label": c.label });
    if (c.log) { inp.min = Math.log10(c.min); inp.max = Math.log10(c.max); inp.step = "any"; }
    inp.value = c.log ? Math.log10(c.value) : c.value;
    inp.addEventListener("input", function () { setParam(c.id, c.log ? Math.pow(10, +inp.value) : +inp.value); });
    onChange(function () {
      var v = S.p[c.id];
      if (document.activeElement !== inp) inp.value = c.log ? Math.log10(v) : v;
      o.textContent = fmt(v, c.fmt, c.unit);
    });
    return h("div", { class: "inp" }, h("label", null, c.label), o, inp);
  }
